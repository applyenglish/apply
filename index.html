<style>

    .dark body { background-color: var(--tw-colors-dark-background); color: white; }

    #splash-screen { display: grid; place-items: center; height: 100vh; width: 100vw; background-color: #f8fafc; font-family: 'Poppins', sans-serif; text-align: center; position: fixed; top: 0; left: 0; z-index: 100; transition: opacity 0.5s ease-out, transform 0.5s ease-out; }
    .dark #splash-screen { background-color: #0f172a; }
    #splash-screen.fade-out { opacity: 0; transform: scale(0.95); pointer-events: none; }
    .splash-container { display: flex; flex-direction: column; align-items: center; }
    .logo-container { display: flex; align-items: center; justify-content: center; gap: 1.25rem; }
    .logo-icon { position: relative; width: 80px; height: 80px; background: linear-gradient(135deg, #a855f7, #6d28d9); border-radius: 28%; display: flex; align-items: center; justify-content: center; box-shadow: 0 10px 20px rgba(109, 40, 217, 0.2); }
    .letter-a { font-size: 48px; font-weight: 600; color: white; }
    .logo-text { font-size: 64px; font-weight: 600; color: #4c1d95; display: flex; }
    .dark .logo-text { color: #ddd6fe; }
    
    #auth-modal { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background-color: rgba(0, 0, 0, 0.5); display: grid; place-items: center; z-index: 100; opacity: 0; pointer-events: none; transition: opacity 0.3s ease; }
    #auth-modal.visible { opacity: 1; pointer-events: auto; }
    .auth-container { width: 90%; max-width: 400px; padding: 2rem; background-color: white; border-radius: 1rem; box-shadow: 0 10px 25px rgba(0,0,0,0.1); position: relative; }
    .dark .auth-container { background-color: var(--tw-colors-dark-surface); }
    .auth-form .form-input { width: 100%; padding: 0.75rem 1rem; border: 1px solid #d1d5db; border-radius: 0.5rem; background-color: #f9fafb; margin-top: 0.25rem; }
    .dark .auth-form .form-input { border-color: #4b5563; background-color: var(--tw-colors-dark-container); color: white; }
    .auth-form .form-submit { width: 100%; padding: 0.75rem 1rem; border-radius: 0.5rem; font-weight: 600; color: white; background: linear-gradient(135deg, #a855f7, #6d28d9); margin-top: 1rem; }

    .header-logo-btn { display: flex; align-items: center; justify-content: center; gap: 0.5rem; }
    .header-logo-icon { width: 48px; height: 48px; background: linear-gradient(135deg, #a855f7, #6d28d9); border-radius: 28%; display: flex; align-items: center; justify-content: center; box-shadow: 0 4px 8px rgba(109, 40, 217, 0.2); }
    .header-logo-icon .letter-a { font-size: 28px; font-weight: 600; color: white; }
    .header-logo-text { font-family: 'Poppins', sans-serif; font-size: 2.25rem; font-weight: 600; color: #4c1d95; }
    .dark .header-logo-text { color: #d1d5db; }

    .progress-ring { position: relative; width: 60px; height: 60px; }
    .progress-ring__svg { transform: rotate(-90deg); }
    .progress-ring__circle { transition: stroke-dashoffset 0.5s ease-out; }
    .progress-ring__text { position: absolute; top: 0; left: 0; width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; font-weight: 600; font-size: 14px; }
    
    .audio-btn { display: inline-flex; align-items: center; justify-content: center; width: 32px; height: 32px; border-radius: 50%; background-color: #e0e7ff; color: #4f46e5; transition: all 0.2s ease; cursor: pointer; }
    .audio-btn:hover { background-color: #c7d2fe; }
    .dark .audio-btn { background-color: #312e81; color: #a5b4fc; }
    .recognition-result { display: block; margin-top: 6px; font-style: italic; }
    
    .phonetic-text { font-family: 'Inter', sans-serif; font-weight: 500; font-size: 0.875rem; color: #0d9488; margin-top: 2px; font-style: italic; }
    .dark .phonetic-text { color: #2dd4bf; }

<!-- Splash Screen -->
<div id="splash-screen">
    <div class="splash-container">
        <div class="logo-container">
            <div class="logo-icon"><span class="letter-a">A</span></div>
            <div class="logo-text"><span>p</span><span>p</span><span>l</span><span>y</span></div>
        </div>
        <p class="mt-4 text-gray-600 dark:text-gray-300 text-lg">Aprende inglés con frases útiles de forma interactiva.</p>
        
        <div class="mt-8 w-full max-w-xs space-y-3">
             <button onclick="window.appLogic.openAuthModal('login')" class="w-full py-3 px-6 text-lg font-semibold text-white bg-orange-500 rounded-full shadow-lg hover:bg-orange-600 transition">Iniciar Sesión</button>
             <button onclick="window.appLogic.openAuthModal('register')" class="w-full py-3 px-6 text-lg font-semibold text-indigo-700 bg-white border-2 border-indigo-200 rounded-full hover:bg-indigo-50 dark:bg-dark-surface dark:text-indigo-300 dark:border-indigo-500 transition">Crear Cuenta</button>
             
             <!-- Botón de Instalación PWA (Aparece automáticamente en móviles compatibles) -->
             <div id="install-container" class="hidden">
                 <button id="btn-install-pwa" class="w-full py-3 px-6 text-lg font-semibold text-white bg-purple-600 rounded-full shadow-lg hover:bg-purple-700 transition flex items-center justify-center gap-2">
                     <i class="fa-solid fa-download"></i> Instalar Aplicación
                 </button>
             </div>

             <button onclick="window.authFunctions.continueWithoutAccount()" class="mt-4 text-sm font-medium text-gray-500 dark:text-gray-400 hover:underline">Continuar como invitado &rarr;</button>
        </div>
    </div>
</div>

<!-- Modal de Autenticación -->
<div id="auth-modal" onclick="if(event.target.id==='auth-modal') window.appLogic.closeAuthModal(null, true)">
    <div class="auth-container">
        <button onclick="window.appLogic.closeAuthModal(null, true)" class="absolute top-4 right-4 text-gray-400 hover:text-gray-600 dark:hover:text-gray-200">
            <i class="fa-solid fa-times fa-lg"></i>
        </button>
        
        <form id="login-form" class="space-y-4 auth-form" onsubmit="event.preventDefault();">
            <h2 class="text-2xl font-bold text-center mb-4 text-indigo-600 dark:text-indigo-400">Iniciar Sesión</h2>
            <button type="button" onclick="window.authFunctions.loginWithGoogle()" class="w-full py-2.5 px-4 border border-gray-300 dark:border-gray-600 rounded-lg flex items-center justify-center gap-2 bg-white dark:bg-dark-container font-medium hover:bg-gray-50 dark:hover:bg-gray-700 transition">
                <img src="https://www.google.com/favicon.ico" class="w-5 h-5" alt="Google">
                <span id="google-btn-text">Ingresar con Google</span>
            </button>
            <div class="flex items-center my-3"><hr class="w-full border-gray-300 dark:border-gray-600"><span class="px-2 text-sm text-gray-400">o</span><hr class="w-full border-gray-300 dark:border-gray-600"></div>
            <div>
                <label class="block text-sm font-medium">Email</label>
                <input type="email" id="login-email" class="form-input" required>
            </div>
            <div>
                <label class="block text-sm font-medium">Contraseña</label>
                <input type="password" id="login-password" class="form-input" required>
            </div>
            <p id="login-error" class="text-red-500 text-sm text-center h-4"></p>
            <button type="button" onclick="window.authFunctions.loginUser(event)" class="form-submit">Entrar</button>
            <p class="text-center text-sm mt-3">¿No tienes cuenta? <button type="button" onclick="window.toggleAuthForm()" class="font-semibold text-indigo-600 dark:text-indigo-400 hover:underline">Regístrate</button></p>
        </form>

        <form id="register-form" class="hidden space-y-4 auth-form" onsubmit="event.preventDefault();">
            <h2 class="text-2xl font-bold text-center mb-4 text-indigo-600 dark:text-indigo-400">Crear Cuenta</h2>
            <div>
                <label class="block text-sm font-medium">Nombre</label>
                <input type="text" id="register-name" class="form-input" required>
            </div>
            <div>
                <label class="block text-sm font-medium">Email</label>
                <input type="email" id="register-email" class="form-input" required>
            </div>
            <div>
                <label class="block text-sm font-medium">Contraseña</label>
                <input type="password" id="register-password" class="form-input" required>
            </div>
            <p id="register-error" class="text-red-500 text-sm text-center h-4"></p>
            <button type="button" onclick="window.authFunctions.registerUser(event)" class="form-submit">Registrar</button>
            <p class="text-center text-sm mt-3">¿Ya tienes cuenta? <button type="button" onclick="window.toggleAuthForm()" class="font-semibold text-indigo-600 dark:text-indigo-400 hover:underline">Inicia Sesión</button></p>
        </form>
    </div>
</div>

<!-- Contenido Principal -->

        <div class="flex items-center space-x-4">

  // --- FUNCIONES DE ALMACENAMIENTO Y PROGRESO ---
  function getCompletedLessonsKey() {
      const user = window.appLogic.getState().currentUser;
      return user ? `completedLessons_${user.uid}` : 'completedLessons_guest';
  }

  function loadCompletedLessons() {
      return JSON.parse(localStorage.getItem(getCompletedLessonsKey())) || [];
  }

  async function syncCompletedLessonsToCloud(updatedList) {
      const user = window.appLogic.getState().currentUser;
      if (user && !user.isAnonymous) {
          try {
              await setDoc(doc(db, "users", user.uid), {
                  completedLessons: updatedList,
                  lastUpdated: new Date().toISOString()
              }, { merge: true });
          } catch (e) {
              console.error("Error al guardar progreso en Firestore:", e);
          }
      }
  }

  window.authFunctions = {
      loginWithGoogle: async () => {
          try {
              const provider = new GoogleAuthProvider();
              await signInWithPopup(auth, provider);
          } catch (e) {
              try {
                  const provider = new GoogleAuthProvider();
                  await signInWithRedirect(auth, provider);
              } catch (err) {
                  document.getElementById('login-error').textContent = "Error al autenticar con Google.";
              }
          }
      },
      registerUser: async (event) => {
          if (event) event.preventDefault();
          const name = document.getElementById('register-name').value;
          const email = document.getElementById('register-email').value;
          const password = document.getElementById('register-password').value;
          try {
              const userCredential = await createUserWithEmailAndPassword(auth, email, password);
              await updateProfile(userCredential.user, { displayName: name });
          } catch (error) {
              document.getElementById('register-error').textContent = error.message;
          }
      },
      loginUser: async (event) => {
          if (event) event.preventDefault();
          const email = document.getElementById('login-email').value;
          const password = document.getElementById('login-password').value;
          try {
              await signInWithEmailAndPassword(auth, email, password);
          } catch (error) {
              document.getElementById('login-error').textContent = "Correo o contraseña incorrectos.";
          }
      },
      logoutUser: async () => {
          await signOut(auth);
          window.appLogic.showPresentation();
      },
      continueWithoutAccount: () => {
          window.appLogic.getState().currentUser = { 
              name: 'Invitado', 
              uid: 'guest_' + Date.now(), 
              isAnonymous: true,
              photoURL: 'https://images.unsplash.com/photo-1544005313-94ddf0286df2?q=80&w=200&auto=format&fit=crop' 
          };
          window.appLogic.updateAuthUI();
          window.appLogic.showAppContent();
      }
  };

  window.appLogic = (() => {
      const appState = { currentUser: null, currentCategory: null, selectedLessonId: null, selectedVoiceGender: 'female', speechRate: 1.0 };
      
      function showPresentation() {
          document.getElementById('app-content').classList.add('hidden');
          document.getElementById('splash-screen').classList.remove('hidden', 'fade-out');
      }
      
      function showAppContent() {
          document.getElementById('splash-screen').classList.add('fade-out');
          setTimeout(() => {
              document.getElementById('splash-screen').classList.add('hidden');
              document.getElementById('app-content').classList.remove('hidden');
              renderCategoryCards();
          }, 400); 
      }

      function openAuthModal(formType = 'login') {
          document.getElementById('auth-modal').classList.add('visible');
          document.getElementById('login-form').classList.toggle('hidden', formType !== 'login');
          document.getElementById('register-form').classList.toggle('hidden', formType !== 'register');
      }

      function closeAuthModal(event, forceClose = false) {
          if (forceClose || (event && event.target.id === 'auth-modal')) {
              document.getElementById('auth-modal').classList.remove('visible');
          }
      }

      function updateAuthUI() {
          const user = appState.currentUser;
          const authControls = document.getElementById('auth-controls');
          if (user) {
              const avatarUrl = user.photoURL || 'https://images.unsplash.com/photo-1544005313-94ddf0286df2?q=80&w=200&auto=format&fit=crop';
              const displayName = user.name || user.displayName || 'Usuario';
              authControls.innerHTML = `
                  <div class="flex items-center gap-2 bg-white dark:bg-dark-container px-3 py-1.5 rounded-full shadow border border-gray-200 dark:border-gray-700">
                      <img src="${avatarUrl}" alt="Avatar" class="w-8 h-8 rounded-full object-cover border border-purple-500">
                      <span class="text-sm font-semibold">${displayName}</span>
                      <button onclick="window.authFunctions.logoutUser()" class="text-xs text-red-500 hover:underline ml-2" title="Cerrar Sesión"><i class="fa-solid fa-right-from-bracket"></i></button>
                  </div>
              `;
          } else {
              authControls.innerHTML = `<button onclick="window.appLogic.openAuthModal('login')" class="px-4 py-2 text-sm font-semibold bg-orange-500 text-white rounded-full">Iniciar Sesión</button>`;
          }
      }

      function renderCategoryCards() {
          const categorySelection = document.getElementById('category-selection');
          const completedLessons = loadCompletedLessons();

          categorySelection.innerHTML = Object.keys(lessonsData).map(key => {
              const cat = lessonsData[key];
              const total = cat.lessons.length;
              const doneCount = cat.lessons.filter(l => completedLessons.includes(l.id)).length;
              const isFinished = doneCount === total && total > 0;

              return `
                  <button onclick="window.appLogic.showLessonsView('${key}')" class="p-6 rounded-2xl ${cat.style.bg} ${cat.style.text} shadow-md hover:shadow-xl transition flex flex-col items-center text-center justify-between border ${cat.style.border}">
                      <div class="flex flex-col items-center">
                          <div class="progress-ring mb-3">
                              <svg class="progress-ring__svg" width="60" height="60">
                                  <circle class="text-gray-300 dark:text-gray-700" stroke="currentColor" stroke-width="6" fill="transparent" r="25" cx="30" cy="30"/>
                                  <circle class="${cat.style.progress} progress-ring__circle" stroke="currentColor" stroke-width="6" fill="transparent" r="25" cx="30" cy="30" style="stroke-dasharray: 157; stroke-dashoffset: ${157 - (doneCount / total) * 157}"/>
                              </svg>
                              <div class="progress-ring__text">
                                  ${isFinished ? '<i class="fa-solid fa-check text-green-600 text-xl"></i>' : `<i class="fa-solid ${cat.icon} text-xl"></i>`}
                              </div>
                          </div>
                          <h3 class="font-bold text-xl mb-1">${cat.title}</h3>
                      </div>
                      <p class="text-xs font-semibold opacity-80 mt-2">${doneCount} de ${total} lecciones</p>
                  </button>
              `;
          }).join('');
      }

      function showLessonsView(key) {
          appState.currentCategory = key;
          document.getElementById('category-selection').classList.add('hidden');
          document.getElementById('lessons-view-container').classList.remove('hidden');
          document.getElementById('lessons-title').textContent = lessonsData[key].title;
          renderLessonsList(key);
      }

      function goBackToCategories() {
          document.getElementById('lessons-view-container').classList.add('hidden');
          document.getElementById('category-selection').classList.remove('hidden');
          renderCategoryCards();
      }

      function renderLessonsList(categoryKey) {
          const listContainer = document.getElementById('lessons-list-column');
          const lessons = lessonsData[categoryKey].lessons;
          const completedLessons = loadCompletedLessons();

          listContainer.innerHTML = lessons.map(lesson => {
              const isDone = completedLessons.includes(lesson.id);
              return `
                  <div onclick="window.appLogic.selectLesson('${lesson.id}')" class="p-4 bg-white dark:bg-dark-surface rounded-xl shadow cursor-pointer border-2 ${isDone ? 'border-green-500' : 'border-transparent'} hover:border-purple-500 transition flex items-center justify-between">
                      <div>
                          <h3 class="font-bold text-lg">${lesson.title}</h3>
                          <p class="text-sm text-gray-500 dark:text-gray-400">${lesson.subtitle}</p>
                      </div>
                      ${isDone ? '<span class="text-green-500 text-xl font-bold"><i class="fa-solid fa-circle-check"></i></span>' : ''}
                  </div>
              `;
          }).join('');

          if (lessons.length > 0) {
              selectLesson(lessons[0].id);
          }
      }

      function selectLesson(lessonId) {
          appState.selectedLessonId = lessonId;
          const lesson = lessonsData[appState.currentCategory].lessons.find(l => l.id === lessonId);
          const detailContainer = document.getElementById('lesson-detail-column');
          const completedLessons = loadCompletedLessons();
          const isDone = completedLessons.includes(lessonId);

          detailContainer.innerHTML = `
              <div class="bg-white dark:bg-dark-surface p-6 rounded-2xl shadow-lg">
                  <div class="flex items-center justify-between mb-4">
                      <h3 class="text-2xl font-bold">${lesson.title}</h3>
                      <label class="flex items-center gap-2 cursor-pointer bg-purple-50 dark:bg-dark-container px-3 py-1.5 rounded-lg border border-purple-200">
                          <input type="checkbox" ${isDone ? 'checked' : ''} onchange="window.appLogic.toggleComplete('${lesson.id}')" class="w-4 h-4 text-purple-600 rounded">
                          <span class="text-xs font-semibold text-purple-700 dark:text-purple-300">Marcar como completada</span>
                      </label>
                  </div>

                  <!-- Controles de Velocidad y Voz -->
                  <div class="flex items-center justify-between mb-6 bg-gray-50 dark:bg-dark-container p-3 rounded-xl border border-gray-100 dark:border-gray-700 flex-wrap gap-2">
                      <div class="flex space-x-2">
                          <button onclick="window.appLogic.setVoiceGender('female')" id="btn-female" class="px-3 py-1.5 rounded-full text-xs font-semibold transition ${appState.selectedVoiceGender === 'female' ? 'bg-purple-600 text-white' : 'bg-gray-200 dark:bg-dark-surface'}">Femenina</button>
                          <button onclick="window.appLogic.setVoiceGender('male')" id="btn-male" class="px-3 py-1.5 rounded-full text-xs font-semibold transition ${appState.selectedVoiceGender === 'male' ? 'bg-purple-600 text-white' : 'bg-gray-200 dark:bg-dark-surface'}">Masculina</button>
                      </div>
                      <div class="flex items-center gap-2">
                          <label class="text-xs font-semibold text-gray-600 dark:text-gray-300"><i class="fa-solid fa-gauge mr-1"></i> Velocidad:</label>
                          <select onchange="window.appLogic.setSpeechRate(this.value)" class="text-xs font-semibold p-1.5 rounded-lg bg-white dark:bg-dark-surface border border-gray-300 dark:border-gray-600 focus:outline-none">
                              <option value="0.65" ${appState.speechRate === 0.65 ? 'selected' : ''}>0.65x (Muy Lenta)</option>
                              <option value="0.8" ${appState.speechRate === 0.8 ? 'selected' : ''}>0.8x (Lenta)</option>
                              <option value="1.0" ${appState.speechRate === 1.0 ? 'selected' : ''}>1.0x (Normal)</option>
                              <option value="1.2" ${appState.speechRate === 1.2 ? 'selected' : ''}>1.2x (Rápida)</option>
                          </select>
                      </div>
                  </div>
                  
                  <img src="${lesson.image_url}" alt="Lesson" class="w-full h-48 object-cover rounded-xl mb-6">
                  
                  <div class="space-y-4">
                      ${lesson.dialogue.map((item, idx) => `
                          <div class="p-4 bg-gray-50 dark:bg-dark-container rounded-xl">
                              <div class="flex items-center justify-between mb-2">
                                  <span class="font-bold text-purple-600 dark:text-purple-400">${item.speaker}:</span>
                                  <div class="flex items-center gap-2">
                                      <button onclick="window.appLogic.speakText(\`${item.text}\`)" class="audio-btn"><i class="fa-solid fa-volume-high"></i></button>
                                      <button onclick="window.appLogic.startSpeechRecognition(${idx}, \`${item.text}\`)" class="audio-btn bg-purple-100 text-purple-700 dark:bg-purple-900/50 dark:text-purple-300" title="Practicar"><i class="fa-solid fa-microphone"></i></button>
                                  </div>
                              </div>
                              <p class="font-semibold">${item.text}</p>
                              <p class="phonetic-text">${item.phonetic}</p>
                              <p class="text-xs text-gray-500 mt-1">${lesson.dialogue_es[idx].text}</p>
                              <div id="recognition-result-${idx}" class="recognition-result text-xs"></div>
                          </div>
                      `).join('')}
                  </div>
              </div>
          `;
      }

      function setVoiceGender(gender) {
          appState.selectedVoiceGender = gender;
          selectLesson(appState.selectedLessonId);
      }

      function setSpeechRate(rate) {
          appState.speechRate = parseFloat(rate);
      }

      async function toggleComplete(lessonId) {
          let completed = loadCompletedLessons();
          if (completed.includes(lessonId)) {
              completed = completed.filter(id => id !== lessonId);
          } else {
              completed.push(lessonId);
          }
          localStorage.setItem(getCompletedLessonsKey(), JSON.stringify(completed));
          await syncCompletedLessonsToCloud(completed);

          renderLessonsList(appState.currentCategory);
          selectLesson(lessonId);
      }

      function speakText(text) {
          if (!('speechSynthesis' in window)) return;
          window.speechSynthesis.cancel();
          const utterance = new SpeechSynthesisUtterance(text);
          utterance.lang = 'en-US';
          utterance.rate = appState.speechRate;
          utterance.volume = 1.0; // Volumen al máximo para evitar que se escuche bajo

          const voices = window.speechSynthesis.getVoices();
          
          if (appState.selectedVoiceGender === 'male') {
              utterance.pitch = 0.85;
              const maleVoice = voices.find(v => (v.lang === 'en-US' || v.lang.startsWith('en')) && 
                  (v.name.includes('Natural') || v.name.includes('Guy') || v.name.includes('Google US English') || v.name.includes('David') || v.name.includes('Male')));
              if (maleVoice) utterance.voice = maleVoice;
          } else {
              utterance.pitch = 1.1; 
              const priorityFemaleVoices = [
                  'Google US English', 'Samantha', 'Ava', 'Jenny', 'Joanna', 'Kimberly', 'Victoria', 'Zira', 'Female'
              ];
              let femaleVoice = null;
              for (const voiceName of priorityFemaleVoices) {
                  femaleVoice = voices.find(v => (v.lang === 'en-US' || v.lang.startsWith('en')) && v.name.includes(voiceName));
                  if (femaleVoice) break;
              }
              if (!femaleVoice) {
                  femaleVoice = voices.find(v => (v.lang === 'en-US' || v.lang.startsWith('en')) && !v.name.toLowerCase().includes('male'));
              }
              if (femaleVoice) utterance.voice = femaleVoice;
          }

          window.speechSynthesis.speak(utterance);
      }

      function startSpeechRecognition(index, expectedText) {
          const resultEl = document.getElementById(`recognition-result-${index}`);
          resultEl.innerHTML = '<i class="fa-solid fa-spinner fa-spin mr-1"></i> Escuchando... Habla ahora';

          const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
          if (!SpeechRecognition) {
              resultEl.textContent = 'El navegador no soporta reconocimiento de voz.';
              return;
          }

          const recognition = new SpeechRecognition();
          recognition.lang = 'en-US';
          recognition.interimResults = false;
          recognition.maxAlternatives = 1;

          let hasProcessed = false;

          recognition.onresult = (e) => {
              if (hasProcessed) return;
              hasProcessed = true;
              const transcript = e.results[0][0].transcript;
              
              const cleanExpected = expectedText.toLowerCase().replace(/[^a-z0-9 ]/g, '').trim();
              const cleanActual = transcript.toLowerCase().replace(/[^a-z0-9 ]/g, '').trim();

              if (cleanExpected === cleanActual) {
                  resultEl.innerHTML = `<span class="text-green-600 font-semibold"><i class="fa-solid fa-check"></i> ¡Excelente! Dijiste: "${transcript}"</span>`;
              } else {
                  resultEl.innerHTML = `<span class="text-amber-600 font-semibold"><i class="fa-solid fa-exclamation-triangle"></i> Dijiste: "${transcript}"</span>`;
              }
          };

          recognition.onerror = (e) => {
              if (hasProcessed) return;
              hasProcessed = true;
              resultEl.innerHTML = `<span class="text-red-500">No se detectó audio claro. Inténtalo de nuevo.</span>`;
          };

          recognition.onend = () => {
              if (!hasProcessed) {
                  hasProcessed = true;
                  resultEl.innerHTML = `<span class="text-amber-600">Tiempo agotado o sin audio. Intenta presionar de nuevo.</span>`;
              }
          };

          try {
              recognition.start();
          } catch (err) {
              resultEl.innerHTML = `<span class="text-red-500">Error al iniciar el micrófono.</span>`;
          }
      }

      return {
          showAppContent, openAuthModal, closeAuthModal, updateAuthUI, showPresentation, 
          showLessonsView, goBackToCategories, renderLessonsList, selectLesson, 
          speakText, startSpeechRecognition, renderCategoryCards, toggleComplete,
          setVoiceGender, setSpeechRate,
          getState: () => appState
      };
  })();

  window.toggleAuthForm = () => {
      document.getElementById('login-form').classList.toggle('hidden');
      document.getElementById('register-form').classList.toggle('hidden');
  };

  onAuthStateChanged(auth, async (user) => {
      const appState = window.appLogic.getState();
      if (user) {
          appState.currentUser = { 
              name: user.displayName || user.email, 
              email: user.email, 
              uid: user.uid, 
              isAnonymous: user.isAnonymous,
              photoURL: user.photoURL || 'https://images.unsplash.com/photo-1544005313-94ddf0286df2?q=80&w=200&auto=format&fit=crop'
          };
          
          if (!user.isAnonymous) {
              try {
                  const userDoc = await getDoc(doc(db, "users", user.uid));
                  if (userDoc.exists() && userDoc.data().completedLessons) {
                      localStorage.setItem(`completedLessons_${user.uid}`, JSON.stringify(userDoc.data().completedLessons));
                  }
              } catch (e) {
                  console.error("Error sincronizando progreso desde la nube:", e);
              }
          }

          window.appLogic.closeAuthModal(null, true);
          window.appLogic.showAppContent();
      } else {
          appState.currentUser = null;
      }
      window.appLogic.updateAuthUI();
  });

  getRedirectResult(auth).then(result => {
      if (result && result.user) {
          window.appLogic.closeAuthModal(null, true);
          window.appLogic.showAppContent();
      }
  }).catch(console.error);

  window.appLogic.showPresentation();
</script>

<!-- Configuración PWA: Registro del Service Worker y Botón de Instalación -->
<script>
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('./sw.js')
        .then((reg) => console.log('Service Worker registrado con éxito:', reg.scope))
        .catch((err) => console.log('Error al registrar el Service Worker:', err));
    });
  }

  let deferredPrompt;
  const installContainer = document.getElementById('install-container');
  const installButton = document.getElementById('btn-install-pwa');

  window.addEventListener('beforeinstallprompt', (e) => {
      e.preventDefault();
      deferredPrompt = e;
      if (installContainer) {
          installContainer.classList.remove('hidden');
      }
  });

  if (installButton) {
      installButton.addEventListener('click', async () => {
          if (!deferredPrompt) return;
          deferredPrompt.prompt();
          const { outcome } = await deferredPrompt.userChoice;
          if (outcome === 'accepted') {
              console.log('El usuario aceptó instalar la PWA');
          }
          deferredPrompt = null;
          installContainer.classList.add('hidden');
      });
  }

  window.addEventListener('appinstalled', () => {
      if (installContainer) {
          installContainer.classList.add('hidden');
      }
  });
</script>
