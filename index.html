<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Apply - Aprende Inglés</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f4f5f7;
        }
        .bg-pastel-blue { background-color: #e0f7fa; color: #006064; }
        .bg-pastel-purple { background-color: #ede7f6; color: #4a148c; }
        .bg-pastel-green { background-color: #e8f5e9; color: #1b5e20; }
        .bg-pastel-yellow { background-color: #fffde7; color: #f57f17; }
        .border-pastel-blue { border-color: #b2ebf2; }
        .border-pastel-purple { border-color: #d1c4e9; }
        .border-pastel-green { border-color: #c8e6c9; }
        .border-pastel-yellow { border-color: #fff9c4; }
    </style>
</head>
<body class="min-h-screen text-gray-800 flex flex-col">

    <!-- Header / Navbar -->
    <header class="bg-white border-b border-gray-200 px-6 py-4 shadow-sm flex items-center justify-between sticky top-0 z-30">
        <div class="flex items-center gap-3 cursor-pointer" onclick="window.appLogic.renderCategories()">
            <div class="w-10 h-10 bg-indigo-600 rounded-xl flex items-center justify-center text-white text-2xl font-black">A</div>
            <span class="text-2xl font-extrabold text-indigo-900 tracking-tight">pply</span>
        </div>

        <div id="authHeaderUI" class="flex items-center gap-3">
            <!-- Dynamic auth content rendered via JS -->
        </div>
    </header>

    <!-- Main Container -->
    <main id="mainContainer" class="flex-1 max-w-6xl w-full mx-auto p-4 md:p-8">
        <!-- Content injected dynamically -->
    </main>

    <!-- Auth Modal -->
    <div id="authModal" class="fixed inset-0 bg-black/50 backdrop-blur-sm z-50 flex items-center justify-center hidden p-4">
        <div class="bg-white w-full max-w-md rounded-2xl p-6 shadow-2xl relative border border-gray-100">
            <button onclick="window.appLogic.closeAuthModal()" class="absolute top-4 right-4 text-gray-400 hover:text-gray-600">
                <i class="fa-solid fa-xmark text-xl"></i>
            </button>
            <h2 id="authModalTitle" class="text-2xl font-bold text-center text-indigo-900 mb-6">Iniciar Sesión</h2>

            <div id="authError" class="hidden mb-4 p-3 bg-red-50 border border-red-200 text-red-600 text-sm rounded-xl"></div>

            <button onclick="window.appLogic.loginWithGoogle()" class="w-full py-3 px-4 border border-gray-300 rounded-xl flex items-center justify-center gap-3 hover:bg-gray-50 transition font-medium text-gray-700 shadow-sm mb-4">
                <svg class="w-5 h-5" viewBox="0 0 24 24">
                    <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
                    <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
                    <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z"/>
                    <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z"/>
                </svg>
                Ingresar con Google
            </button>

            <div class="relative flex py-2 items-center mb-4">
                <div class="flex-grow border-t border-gray-200"></div>
                <span class="flex-shrink mx-4 text-xs text-gray-400 font-medium">o</span>
                <div class="flex-grow border-t border-gray-200"></div>
            </div>

            <form id="emailAuthForm" onsubmit="window.appLogic.handleEmailAuth(event)" class="space-y-4">
                <div>
                    <label class="block text-xs font-semibold text-gray-600 mb-1">Email</label>
                    <input type="email" id="authEmail" required class="w-full px-4 py-2.5 rounded-xl border border-gray-300 focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 outline-none text-sm">
                </div>
                <div>
                    <label class="block text-xs font-semibold text-gray-600 mb-1">Contraseña</label>
                    <input type="password" id="authPassword" required class="w-full px-4 py-2.5 rounded-xl border border-gray-300 focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 outline-none text-sm">
                </div>
                <button type="submit" id="authSubmitBtn" class="w-full py-3 bg-indigo-600 text-white font-semibold rounded-xl hover:bg-indigo-700 transition shadow-md">
                    Entrar
                </button>
            </form>

            <div class="mt-4 text-center">
                <button onclick="window.appLogic.toggleAuthMode()" id="toggleAuthBtn" class="text-xs font-semibold text-indigo-600 hover:underline">
                    ¿No tienes cuenta? Regístrate
                </button>
            </div>
        </div>
    </div>

    <!-- Application Engine Script -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInWithPopup, signInWithRedirect, getRedirectResult, GoogleAuthProvider, signInWithEmailAndPassword, createUserWithEmailAndPassword, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, doc, getDoc, setDoc } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        // Firebase Setup
        const firebaseConfig = typeof __firebase_config !== 'undefined' ? JSON.parse(__firebase_config) : {
            apiKey: "AIzaSyDummyKeyForFallbackOnly",
            authDomain: "apply-english.firebaseapp.com",
            projectId: "apply-english",
            storageBucket: "apply-english.appspot.com",
            messagingSenderId: "123456789",
            appId: "1:123456789:web:abcdef"
        };
        const appId = typeof __app_id !== 'undefined' ? __app_id : 'apply-english-app';

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        // State Store
        const state = {
            currentUser: null,
            completedLessons: new Set(),
            currentCategory: null,
            currentLesson: null,
            isSignUp: false,
            audioSpeed: 1.0,
            voiceGender: 'female',
            recordedAudioUrl: null,
            mediaRecorder: null,
            audioChunks: [],
            isRecording: false,
            recognition: null,
            silenceTimer: null,
            speechSynth: window.speechSynthesis
        };

        // Standard Default Avatar Fallback
        const GUEST_AVATAR = "https://placehold.co/100x100/e2e8f0/475569?text=User";

        // Curriculum Database
        const CATEGORIES = [
            {
                id: 'cotidiana',
                title: 'Vida Cotidiana',
                icon: 'fa-house',
                colorClass: 'bg-pastel-blue border-pastel-blue',
                lessons: [
                    {
                        id: 'cot_1',
                        title: 'Presentación Breve',
                        phrases: [
                            {
                                en: "Hello! My name is Sarah and I work in marketing.",
                                es: "¡Hola! Mi nombre es Sarah y trabajo en marketing.",
                                phon: "Jelóu! Mái néim is Séra and ái uérk in márke-ting."
                            },
                            {
                                en: "It is a pleasure to meet you all.",
                                es: "Es un placer conocerlos a todos.",
                                phon: "It is a plésher tu mít jú ol."
                            }
                        ]
                    },
                    {
                        id: 'cot_2',
                        title: 'Pedir café en la cafetería',
                        phrases: [
                            {
                                en: "I'd like an iced latte with oat milk, please.",
                                es: "Me gustaría un latte helado con leche de avena, por favor.",
                                phon: "Áid láik an áist lá-tei uíz óut mílk, plís."
                            }
                        ]
                    },
                    {
                        id: 'cot_3',
                        title: 'Preguntar direcciones',
                        phrases: [
                            {
                                en: "Excuse me, where is the nearest subway station?",
                                es: "Disculpe, ¿dónde está la estación de metro más cercana?",
                                phon: "Eks-kiús mí, juér is de nírest sáb-uei stéishan?"
                            }
                        ]
                    },
                    {
                        id: 'cot_4',
                        title: 'Hacer compras',
                        phrases: [
                            {
                                en: "How much is this shirt and do you have it in medium?",
                                es: "¿Cuánto cuesta esta camisa y la tienen en talla mediana?",
                                phon: "Jáu mách is dís shért and dú jú jáv it in mí-diom?"
                            }
                        ]
                    }
                ]
            },
            {
                id: 'profesional',
                title: 'Vida Profesional',
                icon: 'fa-briefcase',
                colorClass: 'bg-pastel-purple border-pastel-purple',
                lessons: [
                    {
                        id: 'prof_1',
                        title: 'Presentación de equipo',
                        phrases: [
                            {
                                en: "Everyone, I'd like to introduce our new Marketing Specialist, Alex.",
                                es: "Todos, me gustaría presentarles a nuestro nuevo Especialista en Marketing, Alex.",
                                phon: "Évri-uán, áid láik tu intro-diús áuar niú márke-ting espésha-list, Áleks."
                            }
                        ]
                    },
                    {
                        id: 'prof_2',
                        title: 'Agendar una reunión',
                        phrases: [
                            {
                                en: "Could we schedule a quick call tomorrow at ten?",
                                es: "¿Podríamos agendar una breve llamada mañana a las diez?",
                                phon: "Kúd uí es-kédiul a kuík col tu-mórou at ten?"
                            }
                        ]
                    },
                    {
                        id: 'prof_3',
                        title: 'Enviar un reporte',
                        phrases: [
                            {
                                en: "I have attached the updated quarterly performance analytics.",
                                es: "He adjuntado las analíticas de rendimiento trimestral actualizadas.",
                                phon: "Ái jáv a-tácht de ap-déited kuórter-li per-fór-mans a-na-lí-tiks."
                            }
                        ]
                    },
                    {
                        id: 'prof_4',
                        title: 'Liderar una presentación',
                        phrases: [
                            {
                                en: "Let me walk you through the primary project goals.",
                                es: "Permítanme guiarlos a través de los objetivos principales del proyecto.",
                                phon: "Let mí uók jú zrú de prái-ma-ri pró-yekt góuls."
                            }
                        ]
                    }
                ]
            },
            {
                id: 'viajes',
                title: 'Inglés para Viajes',
                icon: 'fa-plane-departure',
                colorClass: 'bg-pastel-green border-pastel-green',
                lessons: [
                    {
                        id: 'via_1',
                        title: 'En el Aeropuerto',
                        phrases: [
                            {
                                en: "Where is the boarding gate for flight 452?",
                                es: "¿Dónde está la puerta de embarque para el vuelo 452?",
                                phon: "Juér is de bór-ding géit for fláit for-fáiv-tú?"
                            }
                        ]
                    },
                    {
                        id: 'via_2',
                        title: 'Registro de Hotel',
                        phrases: [
                            {
                                en: "I have a reservation under the name of Smith for three nights.",
                                es: "Tengo una reserva a nombre de Smith por tres noches.",
                                phon: "Ái jáv a re-ser-véi-shan án-der de néim of Smíz for zrí náits."
                            }
                        ]
                    },
                    {
                        id: 'via_3',
                        title: 'Pedir un taxi',
                        phrases: [
                            {
                                en: "Can you take me to the city center, please?",
                                es: "¿Puede llevarme al centro de la ciudad, por favor?",
                                phon: "Kan jú téik mí tu de sí-ti sén-ter, plís?"
                            }
                        ]
                    },
                    {
                        id: 'via_4',
                        title: 'Emergencias de viaje',
                        phrases: [
                            {
                                en: "I lost my passport, where is the embassy?",
                                es: "Perdí mi pasaporte, ¿dónde está la embajada?",
                                phon: "Ái lost mái pás-port, juér is de ém-ba-si?"
                            }
                        ]
                    }
                ]
            },
            {
                id: 'financieros',
                title: 'Términos Financieros',
                icon: 'fa-chart-line',
                colorClass: 'bg-pastel-yellow border-pastel-yellow',
                lessons: [
                    {
                        id: 'fin_1',
                        title: 'Presupuesto y Gastos',
                        phrases: [
                            {
                                en: "We need to optimize our budget to reduce monthly expenses.",
                                es: "Necesitamos optimizar nuestro presupuesto para reducir gastos mensuales.",
                                phon: "Uí níd tu óp-ti-máis áuar bá-jet tu re-diús mánz-li eks-pén-ses."
                            }
                        ]
                    },
                    {
                        id: 'fin_2',
                        title: 'Inversión y Retorno',
                        phrases: [
                            {
                                en: "What is the projected return on investment for this option?",
                                es: "¿Cuál es el retorno de inversión proyectado para esta opción?",
                                phon: "Juát is de pro-yék-ted ri-térn on in-vést-ment for dís óp-shan?"
                            }
                        ]
                    },
                    {
                        id: 'fin_3',
                        title: 'Estado de Cuenta',
                        phrases: [
                            {
                                en: "Please review the financial statement for any discrepancies.",
                                es: "Por favor revise el estado financiero en busca de discrepancias.",
                                phon: "Plís ri-viú de fai-nán-shal stéit-ment for é-ni dis-kré-pan-sis."
                            }
                        ]
                    },
                    {
                        id: 'fin_4',
                        title: 'Negociación de contrato',
                        phrases: [
                            {
                                en: "The terms of payment must be clarified before signing.",
                                es: "Los términos de pago deben aclararse antes de firmar.",
                                phon: "De térms of péi-ment mást bí klá-ri-fáid bi-fór sái-ning."
                            }
                        ]
                    }
                ]
            }
        ];

        // Global Controllers Window Object
        window.appLogic = {
            getState: () => state,

            renderHeader: () => {
                const headerUI = document.getElementById('authHeaderUI');
                if (state.currentUser) {
                    const avatarSrc = state.currentUser.photoURL || GUEST_AVATAR;
                    headerUI.innerHTML = `
                        <div class="flex items-center gap-3">
                            <img src="${avatarSrc}" onerror="this.src='${GUEST_AVATAR}'" class="w-9 h-9 rounded-full object-cover border border-gray-300 shadow-sm">
                            <span class="text-xs font-semibold text-gray-700 hidden sm:inline">${state.currentUser.name}</span>
                            <button onclick="window.appLogic.logout()" class="px-3 py-1.5 text-xs font-semibold bg-gray-100 hover:bg-gray-200 text-gray-700 rounded-lg transition">
                                Salir
                            </button>
                        </div>
                    `;
                } else {
                    headerUI.innerHTML = `
                        <div class="flex items-center gap-3">
                            <img src="${GUEST_AVATAR}" class="w-9 h-9 rounded-full border border-gray-200">
                            <button onclick="window.appLogic.openAuthModal()" class="px-4 py-2 text-xs font-bold bg-indigo-600 hover:bg-indigo-700 text-white rounded-xl shadow-sm transition">
                                Iniciar Sesión
                            </button>
                        </div>
                    `;
                }
            },

            renderCategories: () => {
                state.currentCategory = null;
                state.currentLesson = null;
                const container = document.getElementById('mainContainer');

                let html = `<div class="grid grid-cols-1 md:grid-cols-2 gap-6">`;

                CATEGORIES.forEach(cat => {
                    const completedCount = cat.lessons.filter(l => state.completedLessons.has(l.id)).length;
                    const totalCount = cat.lessons.length;
                    const isFullyCompleted = completedCount === totalCount && totalCount > 0;

                    html += `
                        <div onclick="window.appLogic.openCategory('${cat.id}')" class="p-6 rounded-2xl border-2 ${cat.colorClass} shadow-sm hover:shadow-md transition cursor-pointer flex items-center justify-between">
                            <div class="flex items-center gap-4">
                                <div class="w-14 h-14 rounded-2xl bg-white/80 backdrop-blur-sm flex items-center justify-center text-2xl shadow-sm">
                                    <i class="fa-solid ${cat.icon}"></i>
                                </div>
                                <div>
                                    <h3 class="text-xl font-bold mb-1">${cat.title}</h3>
                                    <p class="text-xs opacity-80 font-medium">${completedCount} de ${totalCount} lecciones completadas</p>
                                </div>
                            </div>
                            <div>
                                ${isFullyCompleted ? 
                                    `<div class="w-8 h-8 rounded-full bg-green-500 text-white flex items-center justify-center font-bold text-sm shadow"><i class="fa-solid fa-check"></i></div>` : 
                                    `<div class="text-xs font-bold bg-white/70 px-3 py-1.5 rounded-lg border border-black/5">${completedCount}/${totalCount}</div>`
                                }
                            </div>
                        </div>
                    `;
                });

                html += `</div>`;
                container.innerHTML = html;
            },

            openCategory: (catId) => {
                state.currentCategory = CATEGORIES.find(c => c.id === catId);
                const container = document.getElementById('mainContainer');

                let html = `
                    <div class="mb-6 flex items-center justify-between">
                        <button onclick="window.appLogic.renderCategories()" class="text-xs font-bold text-indigo-600 hover:underline flex items-center gap-2">
                            <i class="fa-solid fa-arrow-left"></i> Volver a categorías
                        </button>
                        <h2 class="text-xl font-bold text-gray-800">${state.currentCategory.title}</h2>
                    </div>
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                `;

                state.currentCategory.lessons.forEach(l => {
                    const isDone = state.completedLessons.has(l.id);
                    html += `
                        <div onclick="window.appLogic.openLesson('${l.id}')" class="p-5 bg-white rounded-2xl border border-gray-200 hover:border-indigo-300 shadow-sm transition cursor-pointer flex items-center justify-between">
                            <div class="flex items-center gap-3">
                                <div class="w-6 h-6 rounded-md border flex items-center justify-center text-xs ${isDone ? 'bg-green-500 border-green-500 text-white' : 'border-gray-300'}">
                                    ${isDone ? '<i class="fa-solid fa-check"></i>' : ''}
                                </div>
                                <span class="font-semibold text-gray-800 text-sm">${l.title}</span>
                            </div>
                            <i class="fa-solid fa-chevron-right text-gray-400 text-xs"></i>
                        </div>
                    `;
                });

                html += `</div>`;
                container.innerHTML = html;
            },

            openLesson: (lessonId) => {
                const lesson = state.currentCategory.lessons.find(l => l.id === lessonId);
                state.currentLesson = lesson;
                const isDone = state.completedLessons.has(lesson.id);
                const container = document.getElementById('mainContainer');

                let html = `
                    <div class="mb-6 flex items-center justify-between">
                        <button onclick="window.appLogic.openCategory('${state.currentCategory.id}')" class="text-xs font-bold text-indigo-600 hover:underline flex items-center gap-2">
                            <i class="fa-solid fa-arrow-left"></i> Volver a ${state.currentCategory.title}
                        </button>
                        <button onclick="window.appLogic.toggleLessonCompletion('${lesson.id}')" class="px-4 py-2 rounded-xl text-xs font-bold border ${isDone ? 'bg-green-50 text-green-700 border-green-300' : 'bg-white text-gray-700 border-gray-300 hover:bg-gray-50'} flex items-center gap-2">
                            <i class="fa-solid ${isDone ? 'fa-check-circle' : 'fa-circle'} text-sm"></i>
                            ${isDone ? 'Completada' : 'Marcar como completada'}
                        </button>
                    </div>

                    <!-- Voice & Speed Control Panel -->
                    <div class="bg-white rounded-2xl p-4 border border-gray-200 shadow-sm mb-6 flex flex-wrap items-center justify-between gap-4">
                        <div class="flex items-center gap-3">
                            <label class="text-xs font-semibold text-gray-600">Velocidad:</label>
                            <select onchange="window.appLogic.setSpeed(parseFloat(this.value))" class="text-xs font-semibold border border-gray-300 rounded-lg px-2.5 py-1.5 bg-gray-50 outline-none">
                                <option value="0.65" ${state.audioSpeed === 0.65 ? 'selected' : ''}>0.65x (Muy Lenta)</option>
                                <option value="0.8" ${state.audioSpeed === 0.8 ? 'selected' : ''}>0.8x (Lenta)</option>
                                <option value="1.0" ${state.audioSpeed === 1.0 ? 'selected' : ''}>1.0x (Normal)</option>
                                <option value="1.2" ${state.audioSpeed === 1.2 ? 'selected' : ''}>1.2x (Rápida)</option>
                            </select>
                        </div>
                        <div class="flex items-center gap-2">
                            <button onclick="window.appLogic.setGender('female')" class="px-3 py-1.5 rounded-lg text-xs font-semibold border ${state.voiceGender === 'female' ? 'bg-indigo-50 border-indigo-300 text-indigo-700' : 'bg-gray-50 border-gray-200 text-gray-600'}">
                                Femenina
                            </button>
                            <button onclick="window.appLogic.setGender('male')" class="px-3 py-1.5 rounded-lg text-xs font-semibold border ${state.voiceGender === 'male' ? 'bg-indigo-50 border-indigo-300 text-indigo-700' : 'bg-gray-50 border-gray-200 text-gray-600'}">
                                Masculina
                            </button>
                        </div>
                    </div>

                    <div class="bg-white rounded-2xl p-6 border border-gray-200 shadow-sm space-y-6">
                        <h3 class="text-lg font-bold text-gray-900 border-b border-gray-100 pb-3">${lesson.title}</h3>

                        <div class="space-y-6">
                `;

                lesson.phrases.forEach((phrase, idx) => {
                    html += `
                        <div class="p-4 bg-gray-50 rounded-xl border border-gray-200 space-y-3">
                            <div class="flex items-start justify-between gap-3">
                                <div>
                                    <p class="text-base font-bold text-gray-900">${phrase.en}</p>
                                    <p class="text-xs text-indigo-700 font-medium italic mt-1">🗣 ${phrase.phon}</p>
                                    <p class="text-xs text-gray-600 mt-1">${phrase.es}</p>
                                </div>
                                <button onclick="window.appLogic.speakText('${phrase.en.replace(/'/g, "\\'")}')" class="w-10 h-10 rounded-full bg-indigo-600 text-white flex items-center justify-center hover:bg-indigo-700 transition shadow">
                                    <i class="fa-solid fa-volume-high"></i>
                                </button>
                            </div>

                            <div class="pt-3 border-t border-gray-200 flex flex-wrap items-center justify-between gap-3">
                                <button onclick="window.appLogic.toggleRecordSpeech('${phrase.en.replace(/'/g, "\\'")}', ${idx})" id="recBtn_${idx}" class="px-4 py-2 bg-red-600 hover:bg-red-700 text-white text-xs font-bold rounded-xl transition flex items-center gap-2">
                                    <i class="fa-solid fa-microphone"></i> Practicar Pronunciación
                                </button>
                                <div id="recStatus_${idx}" class="text-xs font-semibold text-gray-500"></div>
                            </div>

                            <div id="audioPlayback_${idx}" class="hidden pt-2">
                                <audio id="userAudio_${idx}" controls class="w-full h-8"></audio>
                            </div>
                        </div>
                    `;
                });

                html += `</div></div>`;
                container.innerHTML = html;
            },

            setSpeed: (speed) => {
                state.audioSpeed = speed;
            },

            setGender: (gender) => {
                state.voiceGender = gender;
                if (state.currentLesson) {
                    window.appLogic.openLesson(state.currentLesson.id);
                }
            },

            speakText: (text) => {
                if (!state.speechSynth) return;
                state.speechSynth.cancel();

                const utterance = new SpeechSynthesisUtterance(text);
                utterance.lang = 'en-US';
                utterance.rate = state.audioSpeed;

                const voices = state.speechSynth.getVoices();
                let selectedVoice = null;

                if (state.voiceGender === 'female') {
                    selectedVoice = voices.find(v => v.lang.startsWith('en') && (v.name.includes('Google US English') || v.name.includes('Samantha') || v.name.includes('Jenny') || v.name.includes('Ava') || v.name.includes('Female')));
                } else {
                    selectedVoice = voices.find(v => v.lang.startsWith('en') && (v.name.includes('David') || v.name.includes('Male') || v.name.includes('Guy')));
                }

                if (!selectedVoice) {
                    selectedVoice = voices.find(v => v.lang.startsWith('en'));
                }

                if (selectedVoice) utterance.voice = selectedVoice;
                state.speechSynth.speak(utterance);
            },

            toggleRecordSpeech: async (expectedText, idx) => {
                const recBtn = document.getElementById(`recBtn_${idx}`);
                const statusDiv = document.getElementById(`recStatus_${idx}`);
                const playbackContainer = document.getElementById(`audioPlayback_${idx}`);
                const audioElement = document.getElementById(`userAudio_${idx}`);

                if (state.isRecording) {
                    if (state.mediaRecorder) state.mediaRecorder.stop();
                    if (state.recognition) state.recognition.stop();
                    state.isRecording = false;
                    recBtn.classList.replace('bg-gray-800', 'bg-red-600');
                    recBtn.innerHTML = `<i class="fa-solid fa-microphone"></i> Practicar Pronunciación`;
                    return;
                }

                try {
                    const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                    
                    // Audio Recording
                    state.audioChunks = [];
                    state.mediaRecorder = new MediaRecorder(stream);
                    state.mediaRecorder.ondataavailable = e => state.audioChunks.push(e.data);
                    state.mediaRecorder.onstop = () => {
                        const audioBlob = new Blob(state.audioChunks, { type: 'audio/webm' });
                        state.recordedAudioUrl = URL.createObjectURL(audioBlob);
                        audioElement.src = state.recordedAudioUrl;
                        playbackContainer.classList.remove('hidden');
                        stream.getTracks().forEach(t => t.stop());
                    };

                    state.mediaRecorder.start();
                    state.isRecording = true;

                    recBtn.classList.replace('bg-red-600', 'bg-gray-800');
                    recBtn.innerHTML = `<i class="fa-solid fa-stop"></i> Detener`;
                    statusDiv.innerHTML = `<span class="text-amber-600 animate-pulse">Escuchando... (se detendrá al detectar silencio)</span>`;

                    // Speech Recognition
                    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
                    if (SpeechRecognition) {
                        state.recognition = new SpeechRecognition();
                        state.recognition.lang = 'en-US';
                        state.recognition.interimResults = false;

                        state.recognition.onresult = (event) => {
                            const spoken = event.results[0][0].transcript.toLowerCase().trim();
                            const cleanExpected = expectedText.toLowerCase().replace(/[^a-z0-9 ]/g, '');
                            const cleanSpoken = spoken.replace(/[^a-z0-9 ]/g, '');

                            if (cleanSpoken.includes(cleanExpected) || cleanExpected.includes(cleanSpoken)) {
                                statusDiv.innerHTML = `<span class="text-green-600 font-bold">✓ ¡Excelente pronunciación! ("${spoken}")</span>`;
                            } else {
                                statusDiv.innerHTML = `<span class="text-red-600 font-bold">✕ Inténtalo de nuevo. Dijiste: "${spoken}"</span>`;
                            }
                        };

                        state.recognition.onerror = () => {
                            statusDiv.innerHTML = `<span class="text-gray-500">Audio grabado. Escucha tu voz abajo.</span>`;
                        };

                        state.recognition.start();
                    }

                } catch (err) {
                    statusDiv.innerHTML = `<span class="text-red-600">Error al acceder al micrófono.</span>`;
                }
            },

            toggleLessonCompletion: async (lessonId) => {
                if (state.completedLessons.has(lessonId)) {
                    state.completedLessons.delete(lessonId);
                } else {
                    state.completedLessons.add(lessonId);
                }

                const completedArr = Array.from(state.completedLessons);
                
                if (state.currentUser && !state.currentUser.isAnonymous) {
                    try {
                        await setDoc(doc(db, "users", state.currentUser.uid), {
                            completedLessons: completedArr
                        }, { merge: true });
                    } catch (e) {
                        console.error("Error guardando en Firestore:", e);
                    }
                } else {
                    localStorage.setItem('completedLessons_guest', JSON.stringify(completedArr));
                }

                window.appLogic.openLesson(lessonId);
            },

            openAuthModal: () => {
                document.getElementById('authModal').classList.remove('hidden');
            },

            closeAuthModal: () => {
                document.getElementById('authModal').classList.add('hidden');
                document.getElementById('authError').classList.add('hidden');
            },

            toggleAuthMode: () => {
                state.isSignUp = !state.isSignUp;
                document.getElementById('authModalTitle').innerText = state.isSignUp ? 'Crear Cuenta' : 'Iniciar Sesión';
                document.getElementById('authSubmitBtn').innerText = state.isSignUp ? 'Registrarse' : 'Entrar';
                document.getElementById('toggleAuthBtn').innerText = state.isSignUp ? '¿Ya tienes cuenta? Inicia sesión' : '¿No tienes cuenta? Regístrate';
            },

            loginWithGoogle: async () => {
                const provider = new GoogleAuthProvider();
                try {
                    await signInWithPopup(auth, provider);
                    window.appLogic.closeAuthModal();
                } catch (e) {
                    try {
                        await signInWithRedirect(auth, provider);
                    } catch (err) {
                        document.getElementById('authError').innerText = err.message;
                        document.getElementById('authError').classList.remove('hidden');
                    }
                }
            },

            handleEmailAuth: async (e) => {
                e.preventDefault();
                const email = document.getElementById('authEmail').value;
                const password = document.getElementById('authPassword').value;
                try {
                    if (state.isSignUp) {
                        await createUserWithEmailAndPassword(auth, email, password);
                    } else {
                        await signInWithEmailAndPassword(auth, email, password);
                    }
                    window.appLogic.closeAuthModal();
                } catch (err) {
                    document.getElementById('authError').innerText = err.message;
                    document.getElementById('authError').classList.remove('hidden');
                }
            },

            logout: async () => {
                await signOut(auth);
                state.currentUser = null;
                state.completedLessons = new Set();
                window.appLogic.renderHeader();
                window.appLogic.renderCategories();
            }
        };

        // Firebase Auth State Listener
        onAuthStateChanged(auth, async (user) => {
            if (user) {
                state.currentUser = {
                    name: user.displayName || user.email.split('@')[0],
                    email: user.email,
                    uid: user.uid,
                    photoURL: user.photoURL || GUEST_AVATAR,
                    isAnonymous: user.isAnonymous
                };

                try {
                    const userDoc = await getDoc(doc(db, "users", user.uid));
                    if (userDoc.exists() && userDoc.data().completedLessons) {
                        state.completedLessons = new Set(userDoc.data().completedLessons);
                    }
                } catch (e) {
                    console.error("Error sincronizando progreso:", e);
                }
            } else {
                state.currentUser = null;
                const localData = localStorage.getItem('completedLessons_guest');
                state.completedLessons = new Set(localData ? JSON.parse(localData) : []);
            }

            window.appLogic.renderHeader();
            if (!state.currentLesson) {
                window.appLogic.renderCategories();
            }
        });

        // Initialize Web Speech Synthesis Voices
        if (state.speechSynth) {
            state.speechSynth.onvoiceschanged = () => {};
        }

        // Handle Redirect Result
        getRedirectResult(auth).catch((err) => console.log(err));

        // Initial Boot
        window.appLogic.renderHeader();
        window.appLogic.renderCategories();
    </script>
</body>
</html>
